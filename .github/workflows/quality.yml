name: Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shared:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.8'
          channel: stable
      - run: |
          npm ci --ignore-scripts
          python3 -m venv .venv
          .venv/bin/python -m pip install -r scripts/requirements-dev.txt
          flutter pub get
          flutter gen-l10n
          python3 scripts/dev.py check
          python3 scripts/dev.py test
          mkdir -p .local/validation
          git archive --format=tar HEAD -o .local/validation/source.tar
          python3 scripts/check_documentation.py --archive .local/validation/source.tar
      - name: Validate pull request messages
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          python3 scripts/check_repository.py --subject "$PR_TITLE"
          if [ "$PR_AUTHOR" != 'dependabot[bot]' ]; then
            python3 scripts/check_repository.py --commits "$BASE_SHA..$HEAD_SHA"
          fi
      - name: Validate published commit messages
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          revision_range=HEAD
          if [ "$BEFORE_SHA" != '0000000000000000000000000000000000000000' ]; then
            revision_range="$BEFORE_SHA..HEAD"
          fi
          python3 scripts/check_repository.py --commits "$revision_range"
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.8'
          channel: stable
      - run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export MOMENTAI_CMAKE="$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          python3 scripts/build_native_runtime.py --platform android
          python3 scripts/setup_native_tools.py
          python3 scripts/dev.py check --platform android
          flutter pub get
          python3 scripts/audit_native_runtime.py --platform android
          python3 scripts/prepare_models.py
          flutter build apk --debug --target-platform android-arm64 --no-pub
          python3 scripts/check_documentation.py --archive build/app/outputs/flutter-apk/app-debug.apk
          cd android
          ./gradlew --max-workers=2 -Ptarget-platform=android-arm64 :app:lintDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest
  ios:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.8'
          channel: stable
      - name: Verify iOS toolchain
        run: |
          test "$(xcodebuild -version)" = $'Xcode 27.2\nBuild version 27B52'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '27.2'
          test "$(xcrun swift-format --version)" = '6.4.4'
      - run: |
          python3 scripts/build_native_runtime.py --platform ios
          python3 scripts/dev.py check --platform ios
          flutter pub get
          python3 scripts/audit_native_runtime.py --platform ios
          python3 scripts/prepare_models.py
          flutter build ios --release --no-codesign --no-pub
      - name: Run iOS contract tests
        run: |
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Debug -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.2' \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO \
            -skip-testing:RunnerTests/RunnerTests/testCommittedAudioPlayerStartsWithDeviceOutputFormat \
            -resultBundlePath .local/validation/ios-contracts.xcresult
