name: Bug report
description: Report a reproducible problem using sanitized information
title: ""
body:
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: App version, device, OS, model selection, and build mode.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and expected behavior
      description: Include steps, actual result, and expected result. Do not upload private recordings or keys.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Public synthetic examples and redacted logs only. Use private reporting for vulnerabilities.
